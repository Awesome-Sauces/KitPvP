    maven {url "https://hub.spigotmc.org/nexus/content/groups/public/"}
    maven {url "https://repo.essentialsx.net/snapshots/"}

}

dependencies {
    compileOnly files("libs/NametagEdit.jar")
    compileOnly files("libs/citizens.jar")
    compileOnly files("libs/hunter.jar")
    compileOnly files("libs/EssentialsX.jar")
    compileOnly files("libs/bossbar.jar")
    compileOnly files("libs/citizensmain.jar")
    compileOnly files("libs/nbtapi.jar")

    compileOnly "org.spigotmc:spigot:1.8.8-R0.1-SNAPSHOT"
    compileOnly "com.gmail.filoghost.holographicdisplays:holographicdisplays-api:2.4.9"
