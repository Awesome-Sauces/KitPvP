plugins {
    id 'java'
}

group 'me.alpha.kitpvp'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()

    maven { url "https://hub.spigotmc.org/nexus/content/groups/public/"}
